
name: PodSkipper

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  # Declaring `schemes:` at all means XcodeGen generates only what's listed —
  # it does not also auto-create one per target. Both have to be here.
  PodSkipper:
    build:
      targets:
        PodSkipper: all

  PodSkipperScreens:
    build:
      targets:
        PodSkipper: all
        PodSkipperUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PodSkipperUITests

targets:
  PodSkipper:
    type: application
    platform: iOS
    sources:
      - path: Models
      - path: Services
      - path: Views
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.podskipper
        PRODUCT_NAME: PodSkipper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PodSkipper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

        # Audio keeps playback alive when the screen locks.
        # Processing is what lets iOS run transcription overnight.
        UIBackgroundModes:
          - audio
          - processing
          - fetch

        # Must match ProcessingPipeline.backgroundTaskID exactly.
        BGTaskSchedulerPermittedIdentifiers:
          - com.yourname.podskipper.process

        NSSpeechRecognitionUsageDescription: >-
          PodSkipper transcribes episodes on your device to find and skip ads.
          Nothing is sent anywhere.
        NSMicrophoneUsageDescription: >-
          Not used. Present only because the Speech framework declares it.

  # Screenshot harness. Never built by the IPA workflow — that runs
  # `xcodebuild build` against the app target only.
  PodSkipperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PodSkipper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.podskipper.uitests
        TEST_TARGET_NAME: PodSkipper
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
