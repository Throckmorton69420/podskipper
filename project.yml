
name: PodSkipper

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

# The on-device ad model (cloud task 04). PrismML's fork of mlx-swift is
# upstream mlx-swift 0.32.2 plus 1-bit kernels, and replaces the mlx-swift that
# mlx-swift-lm asks for (same package name; the app's own pin wins).
# mlx-swift-lm is pinned to the commit that moved it to mlx-swift 0.32.2: its
# latest release, 3.31.4, is built for 0.31.4. swift-transformers reads the
# tokenizer from the downloaded files.
packages:
  mlx-swift:
    url: https://github.com/PrismML-Eng/mlx-swift
    revision: bb4a4ee3a4ad561415589e24ad5d2edde2912f9f
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: c043fb3b1ccf00f54ef8882a1e8da45c6e32e6f8
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
  # Apple's Core AI Models runtime. CoreAILM wraps CoreAILanguageModel in
  # Foundation Models' LanguageModel protocol and handles tokenization,
  # generation, and Core AI engine selection for exported model bundles.
  coreai-models:
    url: https://github.com/apple/coreai-models
    exactVersion: 0.2.8

schemes:
  # Declaring `schemes:` at all means XcodeGen generates only what's listed —
  # it does not also auto-create one per target. Both have to be here.
  PodSkipper:
    build:
      targets:
        PodSkipper: all

  PodSkipperScreens:
    build:
      targets:
        PodSkipper: all
        PodSkipperUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PodSkipperUITests

targets:
  PodSkipper:
    type: application
    platform: iOS
    sources:
      - path: Models
      - path: Services
      - path: Views
      - path: Shared
      - path: Generated
      # The ad reader's weights (pass 25: TaggerWeights.bin from
      # Tools/DetectionLab/tagger.py train + style).
      - path: Resources/Detection
        buildPhase: resources
    dependencies:
      # The Lock Screen card. Embedded in the app's PlugIns folder, which the
      # IPA carries and KSign re-signs with the app.
      - target: PodSkipperNowPlaying
        embed: true
      # The on-device ad model (Services/LocalModel).
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXGuidedGeneration
      - package: swift-transformers
        product: Tokenizers
      # Optional/open-model Core AI backend (iOS 27+). The large Qwen3 asset
      # is deliberately not checked into git; CoreAIQwen3 discovers it when
      # the resource bundle is supplied separately.
      - package: coreai-models
        product: CoreAILM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.podskipper
        PRODUCT_NAME: PodSkipper
        # iCloud, CarPlay, widgets, and the iOS 27 continued-processing AI
        # capabilities are carried by the paid entitlement file when the
        # provisioning profile authorizes them.
        CODE_SIGN_ENTITLEMENTS: Support/PodSkipper-Paid.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PodSkipper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # ProMotion: without this, custom animations on an iPhone Pro are
        # capped at 60 Hz. System animations and scrolling are already 120.
        # Nothing in the app animates continuously while idle (the backdrop
        # drift and marquee pause when nothing plays), so this costs no
        # battery at rest.
        CADisableMinimumFrameDurationOnPhone: true
        # podskipper://player opens the player — the Lock Screen card's tap.
        CFBundleURLTypes:
          - CFBundleURLName: com.yourname.podskipper
            CFBundleURLSchemes:
              - podskipper

        # Declaring OPML is what makes .opml files selectable in the import
        # picker. Without this, `UTType(filenameExtension: "opml")` returns
        # nil, the allowed-types list falls back to public.xml, and iOS greys
        # out every .opml file on the device because it does not consider them
        # to be XML.
        #
        # The identifier is `org.opml.opml`, not `public.opml`.
        #
        # The `public.` namespace belongs to Apple, and an app that declares an
        # identifier inside it is doing something the type system is entitled to
        # ignore — which is consistent with what happened: the files stopped
        # being greyed out (the extension tag registered) but still could not be
        # picked. `org.opml.opml` is the reverse-DNS of the format's own owner,
        # which is what an *imported* declaration is supposed to look like.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: Outline Processor Markup Language
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
              public.mime-type:
                - text/x-opml
                - text/xml

        # Audio keeps playback alive when the screen locks.
        # Processing is what lets iOS run transcription overnight.
        UIBackgroundModes:
          - audio
          - processing
          - fetch

        # Must match ProcessingPipeline.backgroundTaskID exactly.
        BGTaskSchedulerPermittedIdentifiers:
          - com.yourname.podskipper.process
          # Checking feeds for new episodes. Must match
          # ProcessingPipeline.refreshTaskID.
          - com.yourname.podskipper.refresh
          # A job you started, continuing after you leave the app or the
          # screen locks (BGContinuedProcessingTask). Apple requires the
          # bundle ID, a name, and a wildcard; each request adds its own
          # suffix. BackgroundWork.prefix reads this entry.
          - com.yourname.podskipper.continue.*
          # The same three for his re-signed install (27 Sep: KSign signs
          # PodSkipper as com.worksin.two so the Lock Screen opens it). iOS
          # only runs a task whose name starts with the running app's own
          # bundle ID; the app picks the set that matches at run time
          # (`BackgroundIDs`), so one IPA works under either name.
          - com.worksin.two.process
          - com.worksin.two.refresh
          - com.worksin.two.continue.*

        # Backups (pass 21) are saved in the app's Documents folder, which
        # these two make visible in the Files app as On My iPhone →
        # PodSkipper, so a backup can be copied between installs by hand.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # A .podskipper backup file: selectable in the picker, and tapping
        # one in Files offers to open it in PodSkipper.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.podskipper.backup
            UTTypeDescription: PodSkipper Backup
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - podskipper
        CFBundleDocumentTypes:
          - CFBundleTypeName: PodSkipper Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.podskipper.backup

        # CarPlay. SwiftUI runs the phone's window by itself; this adds the
        # car's. The car only lists the app when it is signed with the CarPlay
        # audio entitlement (Support/PodSkipper-Paid.entitlements) — without
        # it this entry is inert.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate

        NSSpeechRecognitionUsageDescription: >-
          PodSkipper transcribes episodes on your device to find and skip ads.
          Nothing is sent anywhere.
        NSMicrophoneUsageDescription: >-
          Not used. Present only because the Speech framework declares it.

  PodSkipperNowPlaying:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.podskipper.nowplaying
        PRODUCT_NAME: PodSkipperNowPlaying
        CODE_SIGN_ENTITLEMENTS: Support/Widgets-Paid.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Support/NowPlaying-Info.plist
      properties:
        CFBundleDisplayName: PodSkipper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Screenshot harness. Never built by the IPA workflow — that runs
  # `xcodebuild build` against the app target only.
  PodSkipperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PodSkipper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.podskipper.uitests
        TEST_TARGET_NAME: PodSkipper
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
