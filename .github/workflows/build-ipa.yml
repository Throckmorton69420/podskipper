name: Build unsigned IPA

# Builds an IPA with no code signature at all. Ksign applies your own
# certificate on the phone, so CI never needs an Apple account, a .p12,
# or a provisioning profile.

on:
  push:
    branches: [main]
  # Branches pushed by cloud Claude Code sessions (cloud/…) open pull
  # requests; this builds them so a compile error shows on the PR. They
  # never publish the "latest" release (see the step's `if`).
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest main commit needs a ship build. This prevents a burst of small
# pushes from creating a long queue of obsolete IPA builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    # Core AI requires the Xcode 27/iOS 27 SDK. Feather signs the resulting IPA.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      # This step exists purely so that if anything goes wrong, the log
      # shows exactly what files the build could see.
      - name: Show what's actually in the repo
        run: |
          echo "===== repo root ====="
          ls -la
          echo
          echo "===== every file (excluding .git) ====="
          find . -path ./.git -prune -o -type f -print | sort
          echo
          echo "===== project.yml ====="
          cat project.yml || echo "!! project.yml NOT FOUND at repo root !!"

      # Catches half-replaced files before the compiler buries you in 200
      # confusing errors. Every Swift file here keeps its imports at the very
      # top, so an import appearing deep in a file means old content is still
      # sitting underneath newly pasted content.
      - name: Check no file got half-replaced
        run: |
          echo "===== Swift file sizes ====="
          for f in $(find Models Services Views -name '*.swift' | sort); do
            printf "%-42s %4s lines\n" "$f" "$(wc -l < "$f")"
          done
          echo
          BAD=0
          for f in $(find Models Services Views -name '*.swift'); do
            LAST=$(grep -n '^import ' "$f" | tail -1 | cut -d: -f1)
            if [ -n "$LAST" ] && [ "$LAST" -gt 25 ]; then
              echo "PROBLEM: $f has an 'import' on line $LAST."
              echo "         Imports belong at the top. Old content is probably still"
              echo "         in this file underneath what you pasted."
              echo "         Fix: delete the file on GitHub, then re-upload it."
              BAD=1
            fi
          done
          # Two copies of the same filename anywhere in the source tree is a
          # hard build failure in Swift, and it's the easiest mistake to make
          # when uploading files into the wrong folder.
          DUPES=$(find Models Services Views -name '*.swift' -exec basename {} \; | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo
            echo "PROBLEM: these filenames appear in more than one folder:"
            for name in $DUPES; do
              echo "  $name"
              find Models Services Views -name "$name"
            done
            echo
            echo "Swift can't have two files with the same name. Delete the copy"
            echo "that's in the wrong folder on GitHub, then run this again."
            BAD=1
          fi

          if [ "$BAD" = "1" ]; then
            echo
            echo "Stopping here so you get a clear message instead of a wall of compiler errors."
            exit 1
          fi
          echo "All files look complete."


      # Cheap syntax preflight before downloading toolchains or compiling package dependencies.
      # This catches malformed Swift (including unmatched braces/key paths) in seconds.
      - name: Parse Swift sources
        run: |
          chmod +x Scripts/preflight-parse.sh
          ./Scripts/preflight-parse.sh

      # The asset catalog and the build stamp both come from one script, which
      # the local build loop also runs. They used to be written out separately
      # in each place, and drifted: the catalog step opens with `rm -rf
      # Generated` and the stamp writes into `Generated`, so the wrong order
      # silently deleted the stamp and the compiler failed with four
      # `cannot find 'BuildInfo' in scope` errors. One copy of the order now.
      - name: Prepare the generated sources
        run: |
          chmod +x Scripts/prepare-build.sh
          ./Scripts/prepare-build.sh
          cat Generated/BuildInfo.swift


      - name: Show toolchain
        run: |
          # xcode-27 is a dedicated GitHub runner image with the iOS 27 SDK.
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: Install Metal toolchain
        run: |
          set -e
          echo "===== Metal toolchain before download ====="
          xcodebuild -runFirstLaunch || true
          xcodebuild -downloadComponent MetalToolchain
          echo "===== Metal compiler ====="
          xcrun --find metal
          xcrun metal --version

      - name: Install XcodeGen
        run: |
          set -e
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already present"
          elif brew install xcodegen; then
            echo "installed via Homebrew"
          else
            echo "Homebrew failed — falling back to the released binary"
            curl -fsSL -o xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q xcodegen.zip
            sudo cp -R xcodegen/bin/* /usr/local/bin/
            sudo mkdir -p /usr/local/share
            sudo cp -R xcodegen/share/* /usr/local/share/ 2>/dev/null || true
          fi
          xcodegen --version

      - name: Queue, model history, and cancellation regressions
        run: ./Scripts/unit-test.sh

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PodSkipper-unit-tests
          path: |
            build/unit-test.log
            build/unit-*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate the Xcode project
        run: ./Scripts/generate-project.sh

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PodSkipper.xcodeproj \
            -scheme PodSkipper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            MTL_COMPILER_FLAGS="-Wno-c++17-extensions" \
            clean build

      - name: Verify app is unsigned
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/PodSkipper.app"
          test -d "$APP"
          if codesign -dv "$APP" 2>&1 | grep -q "code object is not signed"; then
            echo "Verified: PodSkipper.app is unsigned."
          else
            echo "ERROR: PodSkipper.app is signed. CI must produce an unsigned IPA for Feather."
            codesign -dvv "$APP" 2>&1 || true
            exit 1
          fi

      - name: Package as .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/PodSkipper.app"
          test -d "$APP" || { echo "No .app produced — check the build log above."; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PodSkipper.ipa Payload
          ls -lh PodSkipper.ipa

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSkipper-ipa
          path: PodSkipper.ipa
          retention-days: 30

      # A release gives you a plain HTTPS link you can tap in Safari on the
      # phone. Workflow artifacts download as a .zip behind a login, which is
      # miserable on iOS.
      # The build itself is already safe in the artifact above. This step is
      # only a convenience — a plain HTTPS link you can tap in Safari — so it
      # must never fail the job.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          # `gh release upload --clobber` 404s when the existing asset id has
          # gone stale. Deleting the release outright is the reliable path.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          sleep 2
          gh release create "$TAG" PodSkipper.ipa \
            --title "Latest build" \
            --notes "Unsigned IPA. Sign it with Ksign on device." \
            --target "${{ github.sha }}"
          echo "Download: $(gh release view "$TAG" --json assets -q '.assets[0].url')"
