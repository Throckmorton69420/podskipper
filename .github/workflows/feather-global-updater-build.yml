name: Build Feather Global Updater

on:
  push:
    branches:
      - feather-global-updater-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clone Feather upstream
        run: |
          git clone --recurse-submodules https://github.com/claration/Feather.git upstream-feather
          cd upstream-feather
          git checkout 7078b053c0af262809a48e4d3898d42b0d35fedf
          git submodule update --init --recursive

      - name: Apply Global Updater modification
        shell: bash
        env:
          UPDATE_MANAGER_B64: 
          LIBRARY_VIEW_B64: 
        run: |
          printf '%s' "$UPDATE_MANAGER_B64" | base64 --decode > upstream-feather/Feather/Backend/Observable/UpdateManager.swift
          printf '%s' "$LIBRARY_VIEW_B64" | base64 --decode > upstream-feather/Feather/Views/Library/LibraryView.swift

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version

      - name: Build unsigned Feather IPA
        working-directory: upstream-feather
        run: |
          make iphoneos
          mv packages/Feather.ipa packages/Feather-GlobalUpdater-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-GlobalUpdater-unsigned
          path: upstream-feather/packages/Feather-GlobalUpdater-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
