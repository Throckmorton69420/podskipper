name: Build Feather Global Updater v8

on:
  push:
    branches:
      - feather-global-updater-v8
    paths:
      - "feather_global_v2/**"
      - "feather_global_v3/**"
      - "feather_global_v4/**"
      - "feather_global_v5/**"
      - "feather_global_v6/**"
      - "feather_global_v7/**"
      - "feather_global_v8/**"
      - ".github/workflows/feather-global-updater-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feather-global-updater-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          path: host

      - name: Clone Feather upstream
        run: |
          git clone --recurse-submodules https://github.com/claration/Feather.git upstream-feather
          cd upstream-feather
          git checkout 7078b053c0af262809a48e4d3898d42b0d35fedf
          git submodule update --init --recursive

      - name: Run updater safety policy checks
        run: |
          set -euo pipefail
          swiftc \
            host/feather_global_v7/UpdaterSafetyPolicy.swift \
            host/feather_global_v7/UpdaterSafetyPolicyTests.swift \
            -o /tmp/feather-updater-safety-tests
          /tmp/feather-updater-safety-tests
          swiftc host/feather_global_v8/UpdaterRuntimePolicy.swift host/feather_global_v8/UpdaterRuntimePolicyTests.swift -o /tmp/feather-updater-runtime-tests
          /tmp/feather-updater-runtime-tests
          swiftc host/feather_global_v8/VariantMetadataParser.swift host/feather_global_v8/VariantMetadataParserTests.swift -o /tmp/feather-updater-metadata-tests
          /tmp/feather-updater-metadata-tests
          python3 host/feather_global_v8/check_regression_invariants.py

      - name: Apply Global Updater v8
        run: |
          set -euo pipefail
          cp host/feather_global_v3/UpdateManager.swift upstream-feather/Feather/Backend/Observable/UpdateManager.swift
          cp host/feather_global_v3/LibraryView.swift upstream-feather/Feather/Views/Library/LibraryView.swift
          cp host/feather_global_v3/LibraryCellView.swift upstream-feather/Feather/Views/Library/LibraryCellView.swift
          cp host/feather_global_v2/AppFileHandler.swift upstream-feather/Feather/Utilities/Handlers/AppFileHandler.swift
          cp host/feather_global_v2/InstallPreviewView.swift upstream-feather/Feather/Views/Library/Install/InstallPreviewView.swift
          cp host/feather_global_v4/SigningHandler.swift upstream-feather/Feather/Utilities/Handlers/SigningHandler.swift
          cp host/feather_global_v5/SettingsView.swift upstream-feather/Feather/Views/Settings/SettingsView.swift
          cp host/feather_global_v6/DownloadManager.swift upstream-feather/Feather/Backend/Observable/DownloadManager.swift
          cp host/feather_global_v8/UpdaterRuntimePolicy.swift upstream-feather/Feather/Backend/Observable/UpdaterRuntimePolicy.swift
          cp host/feather_global_v8/VariantMetadataParser.swift upstream-feather/Feather/Backend/Observable/VariantMetadataParser.swift
          cp host/feather_global_v7/UpdaterSafetyPolicy.swift upstream-feather/Feather/Backend/Observable/UpdaterSafetyPolicy.swift
          cp host/feather_global_v7/FR+GlobalUpdater.swift upstream-feather/Feather/Utilities/FR+GlobalUpdater.swift

      - name: Select Xcode
        run: |
          ls -1 /Applications | grep '^Xcode' || true
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d /Applications/Xcode_26.2.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.0.app
          elif [ -d /Applications/Xcode_26.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          elif [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version

      - name: Build unsigned Feather IPA
        working-directory: upstream-feather
        run: |
          set -euo pipefail
          perl -0pi -e 's/-project Feather\.xcodeproj/-workspace Feather.xcworkspace/' Makefile
          perl -0pi -e 's/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = 8;/g' Feather.xcodeproj/project.pbxproj
          make iphoneos
          test -f packages/Feather.ipa

          # Feather copies its local server certificate resources after the app's
          # initial ad-hoc signing pass. Re-seal the final bundle so the delivered
          # IPA has internally consistent resources while remaining teamless and
          # ready for the user's normal sideload-signing tool.
          package_dir="$(mktemp -d)"
          unzip -q packages/Feather.ipa -d "$package_dir"
          app_path="$(find "$package_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          /usr/bin/codesign --force --sign - "$app_path"
          /usr/bin/codesign --verify --deep --strict "$app_path"

          mv packages/Feather.ipa packages/Feather-GlobalUpdater-v8-preseal.ipa
          (
            cd "$package_dir"
            zip -qry "$GITHUB_WORKSPACE/upstream-feather/packages/Feather-GlobalUpdater-v8-unsigned.ipa" Payload
          )
          unzip -t packages/Feather-GlobalUpdater-v8-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-GlobalUpdater-v8-unsigned
          path: upstream-feather/packages/Feather-GlobalUpdater-v8-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
