name: Build unsigned IPA

# Builds an IPA with no code signature at all. Ksign applies your own
# certificate on the phone, so CI never needs an Apple account, a .p12,
# or a provisioning profile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PodSkipper.xcodeproj \
            -scheme PodSkipper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package as .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/PodSkipper.app"
          test -d "$APP" || { echo "No .app produced — check the build log above."; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PodSkipper.ipa Payload
          ls -lh PodSkipper.ipa

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSkipper-ipa
          path: PodSkipper.ipa
          retention-days: 30

      # A release gives you a plain HTTPS link you can tap in Safari on the
      # phone. Workflow artifacts download as a .zip behind a login, which is
      # miserable on iOS.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PodSkipper.ipa --clobber
          else
            gh release create "$TAG" PodSkipper.ipa \
              --title "Latest build" \
              --notes "Unsigned IPA. Sign it with Ksign on device."
          fi
          echo "Download: $(gh release view "$TAG" --json assets -q '.assets[0].url')"
