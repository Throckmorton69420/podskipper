name: Screenshots

# Runs the app in an iPhone simulator, walks every screen, and uploads the
# pictures. Completely separate from build-ipa.yml — if this breaks, your
# IPA build is unaffected.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Views/**'
      - 'Models/**'
      - 'Services/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          echo "--- available simulators ---"
          xcrun simctl list devices available | grep -i iphone || true

      - name: Install XcodeGen
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Build the icon catalog
        run: |
          CATALOG="Generated/Assets.xcassets"
          rm -rf Generated
          mkdir -p "$CATALOG/AppIcon.appiconset"
          printf '{\n  "info" : { "author" : "xcode", "version" : 1 }\n}\n' > "$CATALOG/Contents.json"
          ICON=$(find . -path ./.git -prune -o -name 'AppIcon-1024.png' -print 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$CATALOG/AppIcon.appiconset/AppIcon-1024.png"
            cat > "$CATALOG/AppIcon.appiconset/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon-1024.png", "idiom" : "universal",
                "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          else
            printf '{\n  "images" : [],\n  "info" : { "author" : "xcode", "version" : 1 }\n}\n' \
              > "$CATALOG/AppIcon.appiconset/Contents.json"
          fi

      - name: Generate the project
        run: |
          xcodegen generate --spec project.yml
          echo "--- schemes and targets xcodebuild can see ---"
          xcodebuild -list -project PodSkipper.xcodeproj

      - name: Pick a simulator
        id: sim
        run: |
          # A quoted heredoc so nothing in the script is touched by bash, and
          # the device family arrives as an argument rather than interpolated
          # into a quoted -c string.
          cat > /tmp/pick_sim.py <<'PY'
          import json, re, subprocess, sys

          want = sys.argv[1]
          raw = subprocess.run(["xcrun", "simctl", "list", "devices", "available", "-j"],
                               capture_output=True, text=True).stdout
          devices = json.loads(raw)["devices"]

          best = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if not device.get("isAvailable"):
                      continue
                  name = device["name"]
                  if not name.startswith(want):
                      continue
                  score = 0
                  if "Pro" in name:
                      score += 200
                  if "Max" in name:
                      score += 100
                  numbers = re.findall(r"\d+", name)
                  if numbers:
                      score += int(numbers[0])
                  if best is None or score > best[0]:
                      best = (score, device["udid"], name)

          if best:
              print(best[1])
              print(best[2])
          PY

          python3 /tmp/pick_sim.py "${{ matrix.device }}" > /tmp/sim.txt
          ID=$(sed -n '1p' /tmp/sim.txt)
          NAME=$(sed -n '2p' /tmp/sim.txt)

          if [ -z "$ID" ]; then
            echo "No ${{ matrix.device }} simulator on this runner. Available:"
            xcrun simctl list devices available | head -40
            exit 1
          fi

          echo "Using $NAME ($ID)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$ID" 2>/dev/null || true
          xcrun simctl bootstatus "$ID" -b 2>/dev/null || true

      - name: Run the screenshot tour
        run: |
          set -o pipefail
          # No xcpretty. It isn't installed on the runner image, and piping
          # into a missing binary broke the pipe and truncated the whole log
          # after five lines — which is why test.log told you nothing.
          xcodebuild test \
            -project PodSkipper.xcodeproj \
            -scheme PodSkipperScreens \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath Screens.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log || true

          echo "--- test summary ---"
          grep -E "Test Suite|Test Case|error:|failed|BUILD" test.log | tail -40 || true
          test -d Screens.xcresult || { echo "No result bundle"; tail -120 test.log; exit 1; }

      - name: Extract the screenshots
        id: shots
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path Screens.xcresult --output-path screenshots 2>/dev/null \
            || xcrun xcresulttool export attachments --legacy \
               --path Screens.xcresult --output-path screenshots 2>/dev/null \
            || echo "export attachments unavailable on this toolchain"
          # Flatten and keep only images.
          find screenshots -type f \( -name '*.png' -o -name '*.jpeg' -o -name '*.jpg' \) \
            -exec mv {} screenshots/ \; 2>/dev/null || true
          find screenshots -type d -empty -delete 2>/dev/null || true
          COUNT=$(find screenshots -type f \( -name '*.png' -o -name '*.jpeg' \) | wc -l | tr -d ' ')
          echo "--- captured $COUNT images ---"
          ls -la screenshots || true
          if [ "$COUNT" = "0" ]; then
            echo
            echo "No screenshots came out. That almost always means the UI test"
            echo "never ran — check the build output above for compile errors."
            echo "--- last 60 lines of the test log ---"
            tail -60 test.log || true
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PodSkipper-screenshots-${{ matrix.device }}
          path: |
            screenshots/**
            test.log
          retention-days: 14
          if-no-files-found: warn
