name: Build Feather Global Updates

on:
  push:
    branches:
      - feather-global-updates-build-v1
    paths:
      - "feather_global/**"
      - ".github/workflows/build-feather-global-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build overlays
        uses: actions/checkout@v4
        with:
          path: host

      - name: Checkout Feather upstream
        uses: actions/checkout@v4
        with:
          repository: claration/Feather
          ref: 7078b053c0af262809a48e4d3898d42b0d35fedf
          submodules: recursive
          path: FeatherGlobal

      - name: Apply global updater overlays
        run: |
          set -euo pipefail
          cp host/feather_global/UpdateManager.swift FeatherGlobal/Feather/Backend/Observable/UpdateManager.swift
          cp host/feather_global/LibraryView.swift FeatherGlobal/Feather/Views/Library/LibraryView.swift
          cp host/feather_global/LibraryCellView.swift FeatherGlobal/Feather/Views/Library/LibraryCellView.swift

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep '^Xcode' || true
          # Xcode 26.3 has an intermittent package-graph crash with Feather on
          # GitHub's macOS runner. Prefer 26.2/26.1 when available.
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d /Applications/Xcode_26.2.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.0.app
          elif [ -d /Applications/Xcode_26.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          elif [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version

      - name: Build unsigned IPA
        working-directory: FeatherGlobal
        run: |
          set -euo pipefail
          # The workspace path avoids an Xcode package-graph synchronization
          # crash that can occur when Feather's Makefile invokes the .xcodeproj.
          perl -0pi -e 's/-project Feather\.xcodeproj/-workspace Feather.xcworkspace/' Makefile
          make iphoneos
          test -f packages/Feather.ipa
          cp packages/Feather.ipa packages/Feather-Global-Updates-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Global-Updates-unsigned
          path: FeatherGlobal/packages/Feather-Global-Updates-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
